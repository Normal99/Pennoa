# Pennoa: suggested Hyprland settings (source this from hyprland.conf)
# Design-phase draft: the binaries do not exist yet. Window-rule syntax changes between
# Hyprland releases; check `man hyprland` / the wiki for your version.

# Lowest pen latency: allow tearing for Pennoa only
general {
    allow_tearing = true
}
windowrule = immediate, class:^(pennoa)$

# Map the pen to the built-in screen (find the device name with: hyprctl devices)
# input {
#     tablet {
#         output = eDP-1
#     }
# }

# Handwriting input in other apps (input-method-v2 writing pad)
exec-once = pennoa-ime
bind = SUPER, H, exec, pennoa-ime --toggle

# Tell Pennoa when the 2-in-1 folds into tablet posture (find the switch name with: hyprctl devices)
# bindl = , switch:on:Lenovo Yoga Tablet Mode Switch, exec, pennoa --posture tablet
# bindl = , switch:off:Lenovo Yoga Tablet Mode Switch, exec, pennoa --posture laptop
