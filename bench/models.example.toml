# Copy to models.toml and adjust. Every entry is benchmarked on every page.
# API keys are read from environment variables; never write keys in this file.
#
# Local models run in llama.cpp's server, one at a time, e.g.:
#   llama-server -hf <user>/<repo>-GGUF:Q4_K_M --port 8080 -ngl 99
# (`-hf` downloads the model and its vision projector from Hugging Face.)
# Check each repo's model card for the exact name, licence and recommended quant.

# --- local, open-weight (Apache-2.0 / MIT) ---------------------------------

[[model]]
name = "qwen3.5-4b (local)"
api = "openai"
base_url = "http://127.0.0.1:8080/v1"
model = "qwen3.5-4b"          # llama-server ignores the name; it serves whatever it loaded
tasks = ["text", "math"]

