name: Feature request
description: Suggest an idea for Pennoa
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve for you as a student?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
  - type: textarea
    id: alternatives
    attributes:
      label: How do you handle it today? (other apps, paper, workarounds)
